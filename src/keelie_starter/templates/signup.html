{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create your account</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup" data-once>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="display_name">Your name or company</label>
    <input id="display_name" type="text" name="display_name" value="{{ display_name or '' }}" required autocomplete="organization">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" minlength="12" required autocomplete="new-password">
    <p class="small muted">12 characters or more.</p>
    <button type="submit">Sign up</button>
  </form>
  <p class="small">Have an account? <a href="/login">Log in</a>.</p>
</div>
{% endblock %}
