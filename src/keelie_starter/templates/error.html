{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  <p>{{ detail }}</p>
  {% if request_id %}<p class="small muted">If you contact us, quote this reference: <code>{{ request_id }}</code></p>{% endif %}
  <p><a class="button secondary" href="/">Back to the start</a></p>
</div>
{% endblock %}
