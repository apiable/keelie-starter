[project]
name = "daylight-api"
version = "1.0.0"
description = "Daylight: sunrise, sunset and day length. An example API that sells through Keelie."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "apiable>=0.0.3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.32,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
# The Keelie SDK is not released yet, so it comes from its repository, pinned.
apiable = { git = "https://github.com/apiable/keelie-sdk", subdirectory = "python", rev = "a255b7b80e6abec880fd5f279be1ad40b04d0d4c" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "S", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["daylight"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["daylight", "tests", "export_openapi.py"]

[[tool.mypy.overrides]]
module = ["apiable", "apiable.*"]
ignore_missing_imports = true  # The SDK ships no type marker yet.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
